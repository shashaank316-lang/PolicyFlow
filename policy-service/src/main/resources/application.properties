
spring.application.name=policy-service

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/policyflow}
spring.datasource.username=${DB_USERNAME:shashaankreddydondapaati}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server
server.port=${SERVER_PORT:8080}
# Actuator health and readiness
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# Include database health in readiness
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never

#Log
logging.structured.format.console=logstash

#Security
app.security.username=${APP_SECURITY_USERNAME}
app.security.password=${APP_SECURITY_PASSWORD}
spring.security.user.name=${app.security.username}
spring.security.user.password=${app.security.password}
