spring.application.name=claims-service

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/policyflow_claims}
spring.datasource.username=${DB_USERNAME:shashaankreddydondapaati}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server
server.port=${SERVER_PORT:8082}

# Actuator health and readiness
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# Include database health in readiness
management.endpoint.health.group.readiness.include=readinessState,db,kafka
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Logging
logging.level.org.hibernate.SQL=WARN
logging.structured.format.console=logstash

#Security
app.security.username=${APP_SECURITY_USERNAME}
app.security.password=${APP_SECURITY_PASSWORD}
spring.security.user.name=${app.security.username}
spring.security.user.password=${app.security.password}
