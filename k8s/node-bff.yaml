apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-bff
  namespace: policyflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-bff
  template:
    metadata:
      labels:
        app: node-bff
    spec:
      containers:
        - name: node-bff
          image: policyflow-node-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: POLICY_SERVICE_URL
              value: "http://policy-service:8080"
            - name: CUSTOMER_SERVICE_URL
              value: "http://customer-service:8081"
            - name: CLAIMS_SERVICE_URL
              value: "http://claims-service:8082"
            - name: APP_SECURITY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: policyflow-secrets
                  key: APP_SECURITY_USERNAME
            - name: APP_SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: policyflow-secrets
                  key: APP_SECURITY_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: node-bff
  namespace: policyflow
spec:
  type: ClusterIP
  selector:
    app: node-bff
  ports:
    - name: http
      port: 3000
      targetPort: http
