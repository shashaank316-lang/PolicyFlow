apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-service
  namespace: policyflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-service
  template:
    metadata:
      labels:
        app: policy-service
    spec:
      containers:
        - name: policy-service
          image: policyflow-policy-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: policyflow-secrets
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/policyflow"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: policyflow-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: policyflow-secrets
                  key: POSTGRES_PASSWORD
            - name: SERVER_PORT
              value: "8080"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
  namespace: policyflow
spec:
  type: ClusterIP
  selector:
    app: policy-service
  ports:
    - name: http
      port: 8080
      targetPort: http
