
  name: PolicyFlow CI

  on:
    pull_request:
      branches:
        - main
    push:
      branches:
        - main
    workflow_dispatch:

  permissions:
    contents: read

  jobs:
    build-and-test:
      name: Build and test microservices
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:17
          env:
            POSTGRES_DB: policyflow_claims
            POSTGRES_USER: policyflow
            POSTGRES_PASSWORD: policyflow_test
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U policyflow -d policyflow_claims"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10

        kafka:
          image: apache/kafka:4.1.0
          ports:
            - 9092:9092
          env:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
          options: >-
            --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
            --health-interval 10s
            --health-timeout 10s
            --health-retries 12

      steps:
        - name: Check out repository
          uses: actions/checkout@v4

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
            cache: maven
            cache-dependency-path: '**/pom.xml'

        - name: Test Policy Service
          run: mvn -B -f policy-service/pom.xml clean verify

        - name: Test Customer Service
          run: mvn -B -f customer-service/pom.xml clean verify

        - name: Test Claims Service
          env:
            DB_URL: jdbc:postgresql://localhost:5432/policyflow_claims
            DB_USERNAME: policyflow
            DB_PASSWORD: policyflow_test
            KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          run: mvn -B -f claims-service/pom.xml clean verify
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: policy-service
            context: ./policy-service
          - service: customer-service
            context: ./customer-service
          - service: claims-service
            context: ./claims-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: policyflow-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
