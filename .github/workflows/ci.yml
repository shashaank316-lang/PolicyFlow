name: PolicyFlow CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test microservices
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Test Policy Service
        run: mvn -B -f policy-service/pom.xml clean verify

      - name: Test Customer Service
        run: mvn -B -f customer-service/pom.xml clean verify

      - name: Test Claims Service
        run: mvn -B -f claims-service/pom.xml clean verify
