
  services:
    # -------------------------
    # PostgreSQL
    # -------------------------
    postgres:
      image: postgres:17
      container_name: policyflow-postgres
      environment:
        POSTGRES_USER: policyflow
        POSTGRES_PASSWORD: policyflow_test
        POSTGRES_DB: policyflow
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U policyflow -d policyflow"]
        interval: 5s
        timeout: 5s
        retries: 10
      restart: unless-stopped

    # -------------------------
    # Kafka (KRaft mode)
    # -------------------------
    kafka:
      image: apache/kafka:4.1.0
      container_name: policyflow-kafka
      ports:
        - "9095:9094"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9095
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_NUM_PARTITIONS: 3
      volumes:
        - kafka_data:/var/lib/kafka/data
      healthcheck:
        test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
        interval: 10s
        timeout: 10s
        retries: 12
      restart: unless-stopped

    # -------------------------
    # Policy Service
    # -------------------------
    policy-service:
      build:
        context: ./policy-service
        dockerfile: Dockerfile
      container_name: policyflow-policy-service
      environment:
        DB_URL: jdbc:postgresql://postgres:5432/policyflow
        DB_USERNAME: policyflow
        DB_PASSWORD: policyflow_test
        SERVER_PORT: 8080
      ports:
        - "8080:8080"
      depends_on:
        postgres:
          condition: service_healthy
      restart: unless-stopped

    # -------------------------
    # Customer Service
    # -------------------------
    customer-service:
      build:
        context: ./customer-service
        dockerfile: Dockerfile
      container_name: policyflow-customer-service
      environment:
        DB_URL: jdbc:postgresql://postgres:5432/policyflow_customer
        DB_USERNAME: policyflow
        DB_PASSWORD: policyflow_test
        SERVER_PORT: 8081
      ports:
        - "8081:8081"
      depends_on:
        postgres:
          condition: service_healthy
      restart: unless-stopped

    # -------------------------
    # Claims Service
    # -------------------------
    claims-service:
      build:
        context: ./claims-service
        dockerfile: Dockerfile
      container_name: policyflow-claims-service
      environment:
        DB_URL: jdbc:postgresql://postgres:5432/policyflow_claims
        DB_USERNAME: policyflow
        DB_PASSWORD: policyflow_test
        SERVER_PORT: 8082
        KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        POLICY_SERVICE_BASE_URL: http://policy-service:8080
      ports:
        - "8082:8082"
      depends_on:
        postgres:
          condition: service_healthy
        kafka:
          condition: service_healthy
        policy-service:
          condition: service_started
      restart: unless-stopped

  volumes:
    postgres_data:
    kafka_data:
